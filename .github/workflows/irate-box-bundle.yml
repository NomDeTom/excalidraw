name: Irate-Box app bundle (draw)

# Builds the Excalidraw hub build (yarn build:hub: offline, served at /draw/) for the Irate-Box hub and uploads it as a run artifact,
# irate-box-draw-<commit>, which the hub's librarian can install (through nightly.link, or with
# a GitHub token). No releases: this is a fork for testing. Built from this repository.
# The bundle carries irate-box-bundle.json: which repository and commit it was built from.
# Artifacts expire after 90 days, so this also runs monthly.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

concurrency:
  group: irate-box-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build (hub mode)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build:hub
      - name: Third-party notices
        # THIRD-PARTY-NOTICES.txt in the bundle: what npm does not describe first, then every
        # package installed under node_modules with its license text -- a superset of what the
        # bundle contains, since bundlers also take from devDependencies.
        run: |
          out="excalidraw-app/build/THIRD-PARTY-NOTICES.txt"
          {
            cat <<NOTICE
          Excalidraw (MIT License, (c) Excalidraw), hub build, built for the Irate-Box hub from ${{ github.repository }} at ${{ github.sha }}.
          Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

          NOTICE
            cat <<'NOTICE'
          Fonts in this bundle, from Excalidraw's packages/excalidraw/fonts. Excalifont, Xiaolai and
          Comic Shanns carry their license in the font metadata, quoted below. Virgil, Nunito,
          Lilita One, Cascadia Code, Liberation Sans and Assistant are under the SIL Open Font
          License 1.1 as published by their upstream projects (its text is in Excalifont's block).

          NOTICE
            node -e '
              const fs = require("fs"), dir = "packages/excalidraw/fonts";
              for (const d of fs.readdirSync(dir).sort()) {
                const f = `${dir}/${d}/index.ts`;
                if (!fs.existsSync(f)) continue;
                for (const c of fs.readFileSync(f, "utf8").match(/\/\*[\s\S]*?\*\//g) || [])
                  if (/licen[sc]e/i.test(c)) console.log(`--- font: ${d}\n${c}\n`);
              }'
            node .github/scripts/irate-box-notices.mjs node_modules
          } > "$out"
          du -h "$out"
      - name: Record what was built
        run: |
          cat > "excalidraw-app/build/irate-box-bundle.json" <<JSON
          {"app": "draw", "repository": "${{ github.repository }}", "ref": "$(git rev-parse --abbrev-ref HEAD)",
           "commit": "$(git rev-parse HEAD)", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "run": ${{ github.run_id }}}
          JSON
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          du -sh "excalidraw-app/build"

      - uses: actions/upload-artifact@v7
        with:
          name: irate-box-draw-${{ env.SHORT }}
          path: excalidraw-app/build
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
